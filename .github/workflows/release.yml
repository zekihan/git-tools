name: Publish
'on':
  push:
    tags:
      - v*
permissions:
  contents: read
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  decide:
    uses: zekihan/release-workflows/.github/workflows/decide.yaml@6a5c94057c8fb13b4b826486374cde54cb19e3ac # main
    permissions:
      contents: read
      actions: read
      packages: read
    with:
      mode: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'edge' }}
  checks:
    needs: decide
    if: ${{ needs.decide.outputs.build == 'true' }}
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      publishing: true
  release:
    needs:
      - decide
      - checks
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    uses: zekihan/release-workflows/.github/workflows/release.yaml@6a5c94057c8fb13b4b826486374cde54cb19e3ac # main
    permissions:
      contents: write
      packages: write
    with:
      version: ${{ needs.decide.outputs.version }}
      binaries: true
      goreleaser-version: v2.20.2 # renovate: depName=goreleaser/goreleaser
